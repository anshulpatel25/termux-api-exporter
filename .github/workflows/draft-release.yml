name: Draft Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to create release from'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    # Only run on main branch or via manual dispatch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Calculate next version
        id: calculate_version
        run: |
          # Get the latest tag, or use 0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Latest tag found: ${LATEST_TAG}"

          # Detect prefix
          if [[ "$LATEST_TAG" =~ ^v ]]; then
            PREFIX="v"
            VERSION=${LATEST_TAG#v}
          else
            PREFIX=""
            VERSION=$LATEST_TAG
          fi

          # If no tags exist or the latest is 0.0.0, set first version to 0.1.0
          if [ "$VERSION" = "0.0.0" ]; then
            NEW_VERSION="0.1.0"
            # If it's the first tag, we follow the requirement: first tag should be 0.1.0 (no v)
            PREFIX=""
          else
            # Parse version components
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Get commits since last tag
            COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline)

            # Simple semantic versioning logic based on Conventional Commits
            if echo "$COMMITS" | grep -qiE "(BREAKING CHANGE|breaking):"; then
              # Breaking change: increment major
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ (feat|feature):"; then
              # New feature: increment minor
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              # Default: increment patch
              PATCH=$((PATCH + 1))
            fi

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_tag=${PREFIX}${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Next version: ${NEW_VERSION}"
          echo "Next tag: ${PREFIX}${NEW_VERSION}"

      - name: Build Android ARM64 binary
        run: |
          GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o termux-api-exporter
          chmod +x termux-api-exporter
          tar -czf termux-api-exporter-android-arm64.tar.gz termux-api-exporter
          echo "Binary built and archived successfully"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build APK using gomobile
        run: |
          # Install gomobile
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin

          # Initialize gomobile
          gomobile init

          # Build APK
          # We use ANDROID_NDK_HOME set by setup-ndk action
          gomobile build -target=android -o termux-api-exporter.apk .

          echo "APK built successfully"

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calculate_version.outputs.new_tag }}
          name: Release ${{ steps.calculate_version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            termux-api-exporter-android-arm64.tar.gz
            termux-api-exporter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
